name: Publicar panel movil

on:
  workflow_dispatch:
    inputs:
      temporada:
        description: "Temporada a publicar"
        required: true
        default: "2026-27"
      sims:
        description: "Numero de simulaciones"
        required: true
        default: "20000"
  schedule:
    # Cada 5 minutos. GitHub ejecuta los cron en UTC y puede retrasarlos si hay carga.
    - cron: "*/5 * * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-panel.yml"
      - "requirements.txt"
      - "simliga/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TEMPORADA: ${{ github.event.inputs.temporada || '2026-27' }}
      SIMS: ${{ github.event.inputs.sims || '20000' }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restaurar base de datos cacheada
        id: cache-db
        uses: actions/cache/restore@v4
        with:
          path: |
            data/simliga.sqlite
            data/raw
          key: simliga-db-${{ runner.os }}-${{ env.TEMPORADA }}-${{ github.run_id }}
          restore-keys: |
            simliga-db-${{ runner.os }}-${{ env.TEMPORADA }}-
            simliga-db-${{ runner.os }}-

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear base inicial si no hay cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          if [ ! -f data/simliga.sqlite ]; then
            inicio="${TEMPORADA%%-*}"
            hasta=$((inicio - 1))
            echo "No hay base cacheada: descargando historico 2010-${hasta}."
            python -m simliga ingest --desde 2010 --hasta "${hasta}"
          else
            echo "Base cacheada restaurada."
          fi

      # Lo que `ingest` no trae. Ese comando solo baja football-data.co.uk, que
      # son ligas domesticas; la base local se construyo ademas con estos dos, y
      # sin ellos el panel sale sin competiciones europeas y con el reparto de
      # plazas equivocado.
      #
      # Van fuera del bloque de "si no hay cache" a proposito: son idempotentes,
      # cuestan segundos con la cache de descargas, y asi tambien arreglan una
      # base cacheada que se creo sin ellos.
      - name: Completar la base (competiciones UEFA y Copa del Rey)
        shell: bash
        run: |
          set -euo pipefail
          # El historico europeo. Hace dos cosas: permite proyectar UCL, UEL y
          # Conference, y da los partidos entre ligas con los que se estiman los
          # desfases de Elo entre ellas. Sin el, los desfases salen vacios y los
          # ratings de equipos de distintas ligas dejan de ser comparables.
          python -m simliga calendario-uefa --temporadas \
            2018-19 2019-20 2020-21 2021-22 2022-23 2023-24 2024-25 2025-26

          # El campeon de Copa del Rey se lleva una plaza de Europa League y
          # desplaza el reparto entero. No hay fuente automatica que lo de, asi
          # que se registra a mano: HAY QUE ACTUALIZAR ESTA LINEA CADA TEMPORADA,
          # con el campeon de la temporada anterior a la que se publica.
          python -m simliga copa --temporada 2025-26 --campeon "Real Sociedad"

          python -m simliga copa --temporada 2025-26 --ver

      - name: Actualizar datos y generar panel
        run: |
          python -m simliga actualizar --temporada "$TEMPORADA" --sims "$SIMS" --panel out/panel.html
          cp out/panel.html out/index.html
          touch out/.nojekyll

      - name: Guardar base actualizada en cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/simliga.sqlite
            data/raw
          key: simliga-db-${{ runner.os }}-${{ env.TEMPORADA }}-${{ github.run_id }}

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
